name: Tests
# One job, so each run sets up one runner.
# Further checks belong in this job as steps too; anything slow (a Python version matrix, the image health
# check) belongs in the Weekly checks workflow, not on every pull request.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]   # edited: the pull request text is checked
  push:
    branches: [main]
  workflow_dispatch:    # Auto-merge starts this on main when it can't reuse the pull request's result
permissions:
  contents: read
  pull-requests: read    # the pull request text is read at run time
concurrency:
  # A new push to a pull request cancels the run for its previous commit. Runs on main each get a group
  # of their own, so they are never cancelled or replaced by a later one (each may be promoted).
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0    # the secret scan reads every commit of a pull request
      - name: Install gitleaks
        # Built from source at an exact version with the runner's Go, which checks the module and every
        # dependency against Go's checksum database (sum.golang.org) before building, so a changed release
        # can't slip in. The module keeps its original path (zricethezav) in the gitleaks repository. Dependabot
        # doesn't update this version: bump it by hand. It goes on PATH, so tests/test_secret_scan.py runs it too.
        env:
          VERSION: v8.30.1
        run: |
          export GOBIN="$RUNNER_TEMP/gitleaks-bin"
          go install "github.com/zricethezav/gitleaks/v8@$VERSION"
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Look for committed secrets
        # gitleaks' default rules, with the made-up keys in tests allowlisted by path in .gitleaks.toml. On a
        # pull request it reads each of its commits, so a secret added and removed again is still caught; on
        # main it reads the tree. --redact keeps the match out of its log and report, and only file:line is
        # printed. It needs no secrets, so Dependabot's runs scan too. GitHub's secret scanning and push
        # protection are a separate layer (docs/security.md).
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          if [ "$EVENT" = pull_request ]; then
            set -- git --log-opts="$BASE..$HEAD"
          else
            set -- dir
          fi
          status=0
          gitleaks "$@" --config .gitleaks.toml --redact --no-banner --log-level error \
            --report-format json --report-path "$report" . > /dev/null || status=$?
          hits=$(jq -r '.[] | "\(.File):\(.StartLine)"' "$report" 2> /dev/null | sort -u || true)
          if [ -n "$hits" ]; then
            echo "::error::Something that looks like a secret was committed. Take it out of every commit, revoke it if it is real, and read it from the environment instead:"
            printf '%s\n' "$hits"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::error::gitleaks stopped with exit code $status."
            exit "$status"
          fi
          echo "No secrets found."
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Lint the workflows
        # They run with tokens that can write. actionlint: syntax, expressions and the shell in run steps
        # (through the pinned shellcheck). zizmor: injection, permissions, token exposure and unpinned actions,
        # in the workflows and dependabot.yml; offline, so it needs no token. Any finding fails the run; one
        # accepted on purpose is listed with its reason in .github/zizmor.yml, never silenced in a workflow.
        run: |
          actionlint
          zizmor --offline .
      - name: Tests, with a coverage floor
        # The floor (fail_under in pyproject.toml) is the level reached when it was set, rounded down.
        # The suite also parses the JavaScript, HTML and CSS under web/ (tests/test_web_syntax.py).
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report

      - name: Build the image
        # Build only, nothing is started: a Dockerfile that doesn't parse or build fails here, before Promote
        # can move stable. The slower start-up check stays in the Weekly checks workflow.
        run: docker build -t usher-check .

      - name: Check the pull request text
        # The text must not state a test count or result: this run is the result, and How to test names the
        # command to run. A count or "all"/"every" must come before "tests", so "adds three tests" and "once
        # Tests pass" are not results (tests/test_pr_text_check.py has the cases). Only the line number is
        # printed, not the text.
        if: github.event_name == 'pull_request'
        # The text is read now, not from the event: the event carries the description as it was when the
        # pull request opened, and an edit made with a workflow's own token starts no new run.
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .body)
          body=$(printf '%s\n' "$body" | tr -d '\r')
          hits=$(printf '%s\n' "$body" | grep -niE '\b([0-9]+|all|every)( [a-z0-9-]+){0,2} tests? (all |now |still )?(pass|fail|succeed)(es|s|ed|ing)?\b|\btest suite (now |still )?(pass|fail|succeed)(es|s|ed|ing)?\b|\b[0-9]+ passed\b|\bran [0-9]+ tests?\b|\b(ok|failed) \((skipped|failures|errors)=' | cut -d: -f1 | paste -sd ' ' - || true)
          if [ -n "$hits" ]; then
            echo "::error::The pull request text states a test count or result (line(s) $hits). How to test names the command to run, not what it printed: Tests runs it on every pull request."
            exit 1
          fi

      - name: Check the lines the pull request text must have
        # Rules the reviewer agent used to check (.github/scripts/pr_gates.py lists the paths, and
        # tests/test_pr_gates.py has the cases): a Fixes #<n> line; whether the change alters how a screen looks,
        # so the phone check is asked for; "Reviewer: ran" for a change to sign-in, sessions, what is kept on the
        # device, the workflows, the Dockerfile, compose files or deploy/, or of more than 300 lines; and a change
        # under tests/ (or a reason) for a change to the app; a line in CHANGELOG.md (or a "Changelog: not needed"
        # reason) for a change to usher/, web/, deploy/ or a Dockerfile, while a change to only the project's own
        # workings or its documentation leaves CHANGELOG.md alone. A change to web/sw.js beyond its version line counts
        # as sensitive, so a real service worker change always needs the reviewer.
        # Dependabot's pull requests name no issue and only change versions, so they skip it. The author is checked,
        # not who started the run, so someone editing a Dependabot pull request doesn't bring the rules back.
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" --jq .body > "$RUNNER_TEMP/pull-request.md"
          env -u GH_TOKEN python3 .github/scripts/pr_gates.py "$BASE" "$HEAD" "$RUNNER_TEMP/pull-request.md"

      - name: Look for identifying details
        # Fails if any tracked file matches a pattern in the PRIVACY_PATTERNS secret
        # (one extended regex per line, matched case-insensitively). Only file:line is
        # printed, never the matched text. Dependabot runs get no secrets and only
        # change version numbers, so they skip this; Auto-merge then tests main again.
        # A pull request from a fork gets no secrets either, so it is skipped with a
        # notice and a line in the run's summary: a person merges it by hand, and that push to main runs this step
        # before Promote moves stable. Without the secret, a run here still fails.
        if: github.actor != 'dependabot[bot]'
        env:
          PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          FROM_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ "$FROM_FORK" = true ]; then
            echo "::notice::Pull request from a fork: no secrets, so the check for identifying details runs on main after a person merges it."
            echo "The check for identifying details has not run on this pull request from a fork; it runs on main after a person merges it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$PATTERNS" ]; then
            echo "::error::The repo secret PRIVACY_PATTERNS is not set."
            exit 1
          fi
          printf '%s\n' "$PATTERNS" | tr -d '\r' > "$RUNNER_TEMP/patterns-as-written"
          # An invalid pattern stops the step by its line number alone: git's own error quotes the pattern.
          if ! problem=$(env -u GH_TOKEN python3 "$GITHUB_WORKSPACE/tools/identifying_details.py" --check-patterns "$RUNNER_TEMP/patterns-as-written" 2>&1); then
            echo "::error::${problem:-The patterns could not be checked.}"
            exit 1
          fi
          sed '/^[[:space:]]*$/d' "$RUNNER_TEMP/patterns-as-written" > "$RUNNER_TEMP/patterns"
          # The script prints path:line for each match, but only counts a path that itself matches (or holds a line
          # break), as the pre-push hook does: printing it would show the detail. An error never quotes a pattern.
          if ! found=$(env -u GH_TOKEN python3 "$GITHUB_WORKSPACE/tools/identifying_details.py" --tree "$RUNNER_TEMP/patterns" 2>&1); then
            found=${found:-The search for identifying details failed.}
            echo "::error::${found%%$'\n'*}"
            case "$found" in *$'\n'*) printf '%s\n' "${found#*$'\n'}" ;; esac
            exit 1
          fi
          # A pull request's title and description end up in the squash commit, so they are
          # read now, not from the event (which holds the text as it was when the pull request opened). Only the
          # field that matched is named.
          # The author is checked, not the actor, as in the pull request text steps above.
          if [ -n "$NUMBER" ] && [ "$PR_AUTHOR" != "dependabot[bot]" ]; then
            if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$NUMBER" > "$RUNNER_TEMP/pr.json" 2>/dev/null; then
              echo "::error::The pull request's title and description could not be read, so they were not checked."
              exit 1
            fi
            jq -r '.title // ""' "$RUNNER_TEMP/pr.json" | tr -d '\r' > "$RUNNER_TEMP/pr-title"
            jq -r '.body // ""' "$RUNNER_TEMP/pr.json" | tr -d '\r' > "$RUNNER_TEMP/pr-description"
            if ! found=$(env -u GH_TOKEN python3 "$GITHUB_WORKSPACE/tools/identifying_details.py" --fields "$RUNNER_TEMP/patterns" "$RUNNER_TEMP/pr-title" "$RUNNER_TEMP/pr-description" 2>&1); then
              echo "::error::${found:-The search for identifying details failed.}"
              exit 1
            fi
          fi
          # On main (a push, or the run Auto-merge starts) there is no pull request text to read, so the newest
          # commit's message is, which also covers a fork's pull request merged by hand. Only that it matched is said.
          if [ -z "$NUMBER" ]; then
            if ! found=$(env -u GH_TOKEN python3 "$GITHUB_WORKSPACE/tools/identifying_details.py" --head-message "$RUNNER_TEMP/patterns" 2>&1); then
              echo "::error::${found:-The search for identifying details failed.}"
              exit 1
            fi
          fi
          echo "No identifying details found ($(grep -c . "$RUNNER_TEMP/patterns") patterns checked)."

  promote:
    # On main only (a push, or the run Auto-merge starts after merging), once the tests and the privacy check pass.
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/promote.yml
    permissions:    # the ceiling for Promote, whose jobs each take only their part (see promote.yml)
      contents: write
      pull-requests: write
      issues: write
