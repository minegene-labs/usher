name: Release
# Run by hand, with the new version, when the changes collected under `## [Unreleased]` in CHANGELOG.md are worth a
# release. Merged pull requests only add their lines there; nothing is released on a merge (Promote moves `stable`).
# prepare: gives the collected lines their version (.github/scripts/prepare_release.py renames `[Unreleased]`, leaves
# a fresh one and sets the version in the three files that carry it), commits that to main and pushes it. It pushes
# directly, which the protect-main ruleset allows only because GitHub Actions is a bypass actor; the push is refused
# when main moved on since the run began, and it runs only on main's commit that `stable` already holds (the tested one).
# tested: a push made with the workflow's own token starts no Tests run, so this starts one on main, as Auto-merge does,
# and waits until `stable` holds the release commit, which Promote moves it to only once Tests pass. Nothing is tagged,
# published or built before that. If Tests fail, fix main with a pull request; once `stable` is past the release commit,
# re-run this failed job (not a new Release: the commit is already made) and the rest follows.
# publish: tags that commit and publishes the release, with the version's changelog section as its notes and an
# announcement in the Announcements discussion category.
# image: publishes the version's container image.
# Each job asks for its own permissions, and a failed job can be re-run on its own from the Actions page without
# making the commit again. The version reaches every shell through an environment variable, never through an
# expression in a command.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The new version, digits and dots, for example 1.5.0. At least the app's current version and newer than the latest release.
        required: true
        type: string
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write    # push the release commit to main
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      VERSION: ${{ inputs.version }}
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      version: ${{ steps.push.outputs.version }}
    steps:
      - name: Check that this runs on main
        env:
          REF: ${{ github.ref }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::Run Release on the main branch."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0    # every tag, to check the version is new
      - name: Check that main is the tested commit
        # stable only ever holds a commit whose Tests passed, so a main that stable hasn't reached yet is still being tested
        # (or its promotion failed): nothing is released from it.
        run: |
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/stable)" ] || {
            echo "::error::main is not at stable yet: wait for the Tests run of the latest merge to finish, then run Release again."
            exit 1
          }
      - name: Give the collected changes their version
        run: python3 .github/scripts/prepare_release.py "$VERSION"
      - name: Check the version files and the release notes still read
        run: python3 -m unittest tests.test_versions tests.test_release_notes
      - name: Commit and push to main
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md usher/__init__.py web/sw.js web/updater.js
          git commit -m "chore(release): version $VERSION"
          git push origin HEAD:refs/heads/main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  tested:
    needs: [prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read    # compare stable with the release commit
      actions: write    # start Tests
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Start Tests on the release commit
        run: gh workflow run tests.yml --ref main
      - name: Wait until stable holds the release commit
        # Promote moves stable only to a commit whose Tests passed, and past the release commit once a later merge
        # passes too, so "identical" or "ahead" both mean the release commit was tested.
        run: |
          for _ in $(seq 1 70); do
            status=$(gh api "repos/$GH_REPO/compare/$SHA...stable" --jq .status 2>/dev/null || true)
            case "$status" in
              identical|ahead) echo "stable holds the release commit."; exit 0 ;;
            esac
            sleep 20
          done
          echo "::error::stable has not reached the release commit: Tests may have failed on it. Fix main with a pull request, then re-run this job."
          exit 1

  publish:
    needs: [prepare, tested]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write       # tag the commit, publish the release
      discussions: write    # open its announcement
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Build the release notes from CHANGELOG.md
        # No token here: the script only reads the changelog, with the parser the app's Changelog screen uses.
        run: python3 .github/scripts/release_notes.py "$VERSION" "$RUNNER_TEMP/release-notes.md"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released; nothing to do."
          else
            gh release create "v$VERSION" --target "$SHA" --title "Usher $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --discussion-category Announcements
          fi

  image:
    # The container image of the version just released: linux/amd64 and linux/arm64 in GitHub's container registry,
    # tagged with the version and latest, with its build provenance attested. A version that already has its image
    # (a re-run) builds nothing; the version tag is added last, so a
    # run that stopped before it starts over. The job holds no secret and can't
    # write to the repository: its token publishes packages and attests, and the commit is checked out without it.
    # The base image is pinned by digest in the Dockerfile and kept current by Dependabot.
    needs: [prepare, publish]
    if: ${{ needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read        # check out the commit
      packages: write       # push the image
      id-token: write       # sign the attestation
      attestations: write   # store the attestation
    concurrency:
      group: release-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Name the image
        id: image
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' usher/__init__.py)
          [ -n "$v" ] || { echo "::error::No __version__ found"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Sign in to the registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
      - name: Check whether this version already has its image
        # The version tag is added last, after the image is pushed and attested, so a tag means the job finished.
        # Only "not found" means it has to be built; any other answer (the registry down, a refused sign-in) stops the
        # job so a re-run can try again.
        id: exists
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if answer=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "$IMAGE:$VERSION is already published; nothing to build."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            case "$answer" in
              *"not found"*) echo "publish=yes" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Could not tell whether $IMAGE:$VERSION exists."; exit 1 ;;
            esac
          fi
      - name: Set up emulation for the arm64 build
        if: ${{ steps.exists.outputs.publish == 'yes' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - name: Build and publish the image for both platforms
        # Pushed by digest, with no tag yet: the tags are added once the provenance is attested.
        id: build
        if: ${{ steps.exists.outputs.publish == 'yes' }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          docker buildx create --name usher --driver docker-container --use
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.licenses=MIT" \
            --provenance=false --sbom=false \
            --metadata-file "$RUNNER_TEMP/build.json" \
            .
          digest=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build.json")
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::No image digest found"; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest the image's build provenance
        if: ${{ steps.exists.outputs.publish == 'yes' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Tag the image with the version and latest
        if: ${{ steps.exists.outputs.publish == 'yes' }}
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
