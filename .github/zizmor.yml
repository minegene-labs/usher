# zizmor settings, read from here when it runs from the repository root (the Tests job: zizmor --offline .).
# Every finding fails Tests. The ones below are accepted on purpose; each entry says why. Fix a finding
# instead of adding it here when the workflow can do its job another way.
rules:
  dangerous-triggers:
    ignore:
      # Auto-merge must run after Tests finishes, which only workflow_run allows. It acts only on runs from
      # this repository (never a fork), checks nothing out and runs no pull request code; branch names and
      # other event data reach its shell through env only.
      - auto-merge.yml
      # Strip footer reacts to a comment's text on issue_comment, the only event that covers a pull request's
      # conversation. It checks out main, runs no code from the event, passes the text through env only and
      # edits only the comment's own body, with the one permission that needs. It never uses
      # pull_request_target, which tests/test_fork_safety.py enforces.
      - strip-footer.yml
  self-repository:
    ignore:
      # "./.github/workflows/promote.yml" is GitHub's documented form for a reusable workflow in the same
      # repository and runs it at the caller's commit, which Promote relies on. actionlint rejects the
      # "$/..." form zizmor suggests.
      - auto-merge.yml
      # Same reusable workflow call as above, from Tests on main.
      - tests.yml
  artipacked:
    ignore:
      # Promote pushes the tested commit to the stable branch with the credentials the checkout keeps. It uploads
      # no artifacts and runs no pull request code, so the stored token goes nowhere.
      - promote.yml
